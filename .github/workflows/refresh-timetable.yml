name: Refresh timetable

# Every Monday at 05:00 UTC, pull the latest official Go Cornwall timetable from the
# Bus Open Data Service and commit data/timetable.json if any bus times changed.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild timetable from BODS
        run: python tools/build_timetable.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/timetable.json; then
            echo "No timetable changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/timetable.json
          git commit -m "Refresh bus timetable from BODS"
          git push
